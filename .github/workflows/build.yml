name: build-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install pyinstaller requests pillow
          pip install PySide6

      - name: 生成图标
        run: python make_icon.py

      - name: 打包 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --name "Weverse抢号助手" --onedir --windowed --noconfirm --clean \
            --icon assets/app.icns \
            --exclude-module PySide6_WebEngine --exclude-module tkinter app.py
          hdiutil create -volname "Weverse抢号助手" \
            -srcfolder "dist/Weverse抢号助手.app" -ov -format UDZO \
            "dist/Weverse抢号助手-v0.2-mac.dmg"

      - name: 打包 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --name "Weverse抢号助手" --onefile --windowed --noconfirm --clean \
            --icon assets/app.ico \
            --exclude-module PySide6_WebEngine --exclude-module tkinter app.py

      - name: 上传构建产物 (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: weverse-grabber-mac
          path: dist/*.dmg

      - name: 上传构建产物 (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: weverse-grabber-windows
          path: dist/*.exe

      - name: 发布 Release（打 tag 时触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe